spring:
  profiles:
    default: local
  config:
    # Optional, untracked local overrides. Keep property names in sync with application-secrets.yml.
    import: optional:file:./application-secrets.yml
  application:
    name: stock-news-scheduler-svc
  datasource:
    # Local secrets-file properties or environment variables override these defaults.
    # Shared with investment-management-svc (folio-pro): one folio_pro database, all tables in public.
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/folio_pro}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:folio_pro}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      # Create/update this service's tables from the JPA entities. They share the public schema with
      # folio-pro's Flyway-managed tables, so keep entity table names distinct from folio-pro's.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  task:
    scheduling:
      enabled: true

server:
  port: ${SERVER_PORT:8082}

cors:
  # Browser origins allowed to call /api/** (comma-separated). The Angular dev server runs on 4200.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

fmp:
  # Keep the key in application-secrets.yml or set FMP_API_KEY in the environment.
  base-url: ${FMP_BASE_URL:https://financialmodelingprep.com/stable}
  api-key: ${FMP_API_KEY:}
  daily-request-limit: ${FMP_DAILY_REQUEST_LIMIT:250}
  us-exchanges-only: ${FMP_US_EXCHANGES_ONLY:true}
  # A saved profile updated today (in this zone) is served from PostgreSQL; otherwise FMP is called.
  profile-refresh-time-zone: ${FMP_PROFILE_REFRESH_TIME_ZONE:America/Chicago}

tapetide:
  # NSE/BSE fundamentals. Free plan: 50 calls/day. Token from https://tapetide.com/settings/tokens
  # Keep the token in application-secrets.yml or set TAPETIDE_TOKEN in the environment.
  base-url: ${TAPETIDE_BASE_URL:https://mcp.tapetide.com}
  token: ${TAPETIDE_TOKEN:}
  # Saved rows younger than these are returned from PostgreSQL without a Tapetide call (saves quota).
  quote-refresh-minutes: ${TAPETIDE_QUOTE_REFRESH_MINUTES:60}
  data-refresh-minutes: ${TAPETIDE_DATA_REFRESH_MINUTES:1440}
  timeout-seconds: ${TAPETIDE_TIMEOUT_SECONDS:30}

upstox:
  # Live quotes and candles. Use the free read-only Analytics Token (valid ~1 year) from
  # https://account.upstox.com/developer/apps -> Analytics tab. Keep it in application-secrets.yml.
  base-url: ${UPSTOX_BASE_URL:https://api.upstox.com}
  access-token: ${UPSTOX_ACCESS_TOKEN:}

nse:
  # Free, official NSE symbol lists (no API key). Downloaded weekly to storage-directory as CSV files
  # and read by GET /api/india/nse/symbols. NSE blocks requests without a browser-like User-Agent.
  equity-list-url: ${NSE_EQUITY_LIST_URL:https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv}
  etf-list-url: ${NSE_ETF_LIST_URL:https://nsearchives.nseindia.com/content/equities/eq_etfseclist.csv}
  storage-directory: ${NSE_STORAGE_DIRECTORY:./data/nse}
  timeout-seconds: ${NSE_TIMEOUT_SECONDS:30}
  # Download once at startup when the CSV files are missing (first run or a fresh container).
  sync-on-startup: ${NSE_SYNC_ON_STARTUP:true}
  schedule:
    cron-expression: ${NSE_SCHEDULE_CRON_EXPRESSION:0 0 6 * * SUN}  # Sundays 06:00
    timezone: ${NSE_SCHEDULE_TIMEZONE:Asia/Kolkata}

app:
  notifications:
    # Secret-file property names map directly to app.notifications.* below.
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      portfolio-webhook-url: ${SLACK_PORTFOLIO_WEBHOOK_URL:}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
    whatsapp:
      enabled: ${WHATSAPP_ENABLED:false}
      twilio-sid: ${TWILIO_ACCOUNT_SID:}
      twilio-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_WHATSAPP_FROM:}
      to-number: ${TWILIO_WHATSAPP_TO:}
  apis:
    # API keys can be supplied through environment variables or application-secrets.yml.
    # Never add actual credentials to this tracked file.
    finnhub-key: ${FINNHUB_API_KEY:}
    newsapi-key: ${NEWSAPI_KEY:}
    finnhub-base-url: ${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
    yahoo-base-url: ${YAHOO_FINANCE_BASE_URL:https://query1.finance.yahoo.com}
    alpha-vantage-key: ${ALPHA_VANTAGE_API_KEY:}
    alpha-vantage-base-url: ${ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co/query}
    timeout-seconds: ${APP_APIS_TIMEOUT_SECONDS:5}
    max-retries: ${APP_APIS_MAX_RETRIES:3}
  schedule:
    cron-expression: ${APP_SCHEDULE_CRON_EXPRESSION:0 0 9 * * MON-FRI}
    timezone: ${APP_SCHEDULE_TIMEZONE:America/Chicago}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.stocknews: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
