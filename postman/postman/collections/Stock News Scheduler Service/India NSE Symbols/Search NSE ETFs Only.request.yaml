$kind: http-request
description: "type=ETF returns only ETFs from eq_etfseclist.csv."
url: "{{url}}/api/india/nse/symbols?query=nifty&type=ETF&limit=20"
method: GET
queryParams:
  query: nifty
  type: ETF
  limit: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
