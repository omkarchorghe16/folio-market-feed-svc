$kind: http-request
description: "section: quarterly, profit_loss, balance_sheet, cash_flow or ratios (omit for all). periods: 1-40. Saved to tapetide_stock_datasets (dataset=financials)."
url: "{{url}}/api/india/tapetide/financials/{{indiaSymbol}}?section=ratios&periods=5"
method: GET
queryParams:
  section: ratios
  periods: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 with saved data, or 204 if the symbol was skipped (see app logs)", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });

      if (pm.response.code === 200) {
        pm.test("Saved row has createdDate and updatedDate", function () {
          var body = pm.response.json();
          pm.expect(body).to.have.property("createdDate");
          pm.expect(body).to.have.property("updatedDate");
        });
      }
    language: text/javascript
order: 5000
