$kind: http-request
description: "Promoter, FII, DII and public holdings. type: quarterly or annual (omit for all). Saved to tapetide_stock_datasets (dataset=shareholding)."
url: "{{url}}/api/india/tapetide/shareholding/{{indiaSymbol}}?type=quarterly"
method: GET
queryParams:
  type: quarterly
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 with saved data, or 204 if the symbol was skipped (see app logs)", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });

      if (pm.response.code === 200) {
        pm.test("Saved row has createdDate and updatedDate", function () {
          var body = pm.response.json();
          pm.expect(body).to.have.property("createdDate");
          pm.expect(body).to.have.property("updatedDate");
        });
      }
    language: text/javascript
order: 7000
