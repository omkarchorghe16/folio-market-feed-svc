$kind: http-request
description: "A wrong symbol never returns an error: the app logs the details and responds 204 No Content. Note: this still uses 1 Tapetide call."
url: "{{url}}/api/india/tapetide/quote/NOSUCHXYZ"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Wrong symbol is skipped with 204, not an error", function () {
        pm.response.to.have.status(204);
      });
    language: text/javascript
order: 10000
