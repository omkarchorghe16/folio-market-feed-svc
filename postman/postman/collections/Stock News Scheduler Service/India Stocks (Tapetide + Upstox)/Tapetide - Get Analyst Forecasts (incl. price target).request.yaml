$kind: http-request
description: "Analyst estimates vs actuals: EPS, revenue, EBITDA, net income, ROA, ROE and price target (payload.data[0].bands.price: estimate/high/low). Saved to tapetide_stock_datasets (dataset=forecasts)."
url: "{{url}}/api/india/tapetide/forecasts/{{indiaSymbol}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 with saved data, or 204 if the symbol was skipped (see app logs)", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });

      if (pm.response.code === 200) {
        pm.test("Saved row has createdDate and updatedDate", function () {
          var body = pm.response.json();
          pm.expect(body).to.have.property("createdDate");
          pm.expect(body).to.have.property("updatedDate");
        });
      }
    language: text/javascript
order: 8000
