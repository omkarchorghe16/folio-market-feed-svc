# The database is the shared folio_pro PostgreSQL (also used by folio-portfolio-api) running on
# the Mac host. This service keeps its tables in the public schema of that database.
services:
  news-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: folio-market-feed-svc:local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      # NSE and NASDAQ symbol files survive container rebuilds; they are downloaded again only when missing.
      - market-feed-data:/app/data
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:${POSTGRES_HOST_PORT:-5432}/${POSTGRES_DB:-folio_pro}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-folio_pro}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      FMP_BASE_URL: ${FMP_BASE_URL:-https://financialmodelingprep.com/stable}
      FMP_DAILY_REQUEST_LIMIT: ${FMP_DAILY_REQUEST_LIMIT:-250}
      FMP_US_EXCHANGES_ONLY: ${FMP_US_EXCHANGES_ONLY:-true}
      FMP_PROFILE_REFRESH_TIME_ZONE: ${FMP_PROFILE_REFRESH_TIME_ZONE:-America/Chicago}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FINNHUB_BASE_URL: ${FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
      YAHOO_FINANCE_BASE_URL: ${YAHOO_FINANCE_BASE_URL:-https://query1.finance.yahoo.com}
      ALPHA_VANTAGE_BASE_URL: ${ALPHA_VANTAGE_BASE_URL:-https://www.alphavantage.co/query}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_PORTFOLIO_WEBHOOK_URL: ${SLACK_PORTFOLIO_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_WHATSAPP_TO: ${TWILIO_WHATSAPP_TO:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      APP_APIS_TIMEOUT_SECONDS: ${APP_APIS_TIMEOUT_SECONDS:-5}
      APP_APIS_MAX_RETRIES: ${APP_APIS_MAX_RETRIES:-3}
      APP_SCHEDULE_CRON_EXPRESSION: ${APP_SCHEDULE_CRON_EXPRESSION:-0 0 9 * * MON-FRI}
      APP_SCHEDULE_TIMEZONE: ${APP_SCHEDULE_TIMEZONE:-America/Chicago}

volumes:
  market-feed-data:
