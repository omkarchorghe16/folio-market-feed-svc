# Copy this file to application-secrets.yml in the repository root and fill in local values.
# application-secrets.yml is ignored by Git and loaded for local application runs.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/folio_pro
    username: folio_pro
    password: ""

fmp:
  api-key: ""

tapetide:
  token: ""        # tpt_rt_... from https://tapetide.com/settings/tokens

upstox:
  access-token: "" # Analytics Token from https://account.upstox.com/developer/apps

app:
  apis:
    finnhub-key: ""
    newsapi-key: ""
    alpha-vantage-key: ""
  notifications:
    slack:
      webhook-url: ""
      portfolio-webhook-url: ""
    telegram:
      bot-token: ""
      chat-id: ""
    whatsapp:
      enabled: false
      twilio-sid: ""
      twilio-token: ""
      from-number: ""
      to-number: ""
